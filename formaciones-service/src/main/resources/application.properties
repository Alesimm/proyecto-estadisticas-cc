spring.application.name=formaciones-service
server.port=8085

# Conexión a MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/db_formaciones?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- ÓRDENES EXPLÍCITAS PARA DESPERTAR A FLYWAY ---
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- HIBERNATE (Solo valida) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true