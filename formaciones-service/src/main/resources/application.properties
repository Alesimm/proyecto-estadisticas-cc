# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
# Usamos el puerto 8085 para que no choque con estadisticas-service (que asumo usa 8084)
server.port=8085
spring.application.name=formaciones-service

# ===============================
# CONEXIÓN A BASE DE DATOS (XAMPP)
# ===============================
# El createDatabaseIfNotExist=true creará db_formaciones automáticamente
spring.datasource.url=jdbc:mysql://localhost:3306/db_formaciones?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================
# 'update' crea o actualiza las tablas sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CONFIGURACIÓN DE EUREKA (Opcional por ahora, pero buena práctica)
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true