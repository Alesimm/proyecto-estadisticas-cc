# Cambiar de 8084 a 8090
server.port=8090
spring.application.name=usuarios-service

# Base de Datos (Asegúrate de mantener el puerto 3310 de MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3310/db_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

