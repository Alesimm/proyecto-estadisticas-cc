server.port=8089
spring.application.name=recomendaciones-service

# Base de Datos
spring.datasource.url=jdbc:mariadb://localhost:3310/db_recomendaciones
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# URLs Microservicios
api.jugadores.url=http://localhost:8081/api/jugadores
api.rendimiento.url=http://localhost:8087/api/rendimiento
api.estadisticas.url=http://localhost:8083/api/estadisticas