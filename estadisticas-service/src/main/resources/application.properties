spring.application.name=estadisticas-service
server.port=8084

# Conexión a MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/db_estadisticas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Forzar a Flyway a ejecutarse
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate no toca la BD, solo Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true