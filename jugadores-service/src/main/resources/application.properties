spring.application.name=jugadores-service
server.port=8081

# Conexión adaptada a MariaDB (XAMPP) en puerto 3310
spring.datasource.url=jdbc:mariadb://localhost:3310/db_jugadores?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate solo valida, Flyway crea las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Conexión al ecosistema Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/